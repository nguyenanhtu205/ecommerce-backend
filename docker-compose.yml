services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_MULTIPLE_DATABASES: auth_db,user_db,seller_db,inventory_db,order_db,payment_db,shipping_db,notification_db,wishlist_db,promotion_db,media_db
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql
      - ./infra/postgres/init-multi-db.sh:/docker-entrypoint-initdb.d/init-multi-db.sh
      - ./infra/postgres/init-notification-db.sh:/docker-entrypoint-initdb.d/init-notification-db.sh
      - ./infra/postgres/migrations/notification-service/0001_init.sql:/docker-entrypoint-initdb.d/notification/0001_init.sql
  
  #  mongo:
  #    image: mongo:7
  #    ports:
  #      - '27017:27017'
  #    volumes:
  #      - mongodata:/data/db
  #    # Mỗi service tự connect với connection string khác nhau,
  #    # ví dụ mongodb://mongo:27017/product_catalog_db, .../review_db, .../chat_db

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
  
  #  minio:
  #    image: minio/minio:RELEASE.2025-10-15T17-29-55Z
  #    command: server /data --console-address ":9001"
  #    environment:
  #      MINIO_ROOT_USER: minioadmin
  #      MINIO_ROOT_PASSWORD: minioadmin
  #    ports:
  #      - '9000:9000'
  #      - '9001:9001'
  #    volumes:
  #      - miniodata:/data
  
  kong:
    image: kong:3.6
    environment:
      KONG_DATABASE: 'off'
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_LISTEN: '0.0.0.0:8000'
      KONG_ADMIN_LISTEN: '0.0.0.0:8001'
    volumes:
      - ./gateway/kong/kong.yml:/kong/kong.yml
    ports:
      - '8000:8000'   # client port
      - '8001:8001'   # dev port
    depends_on:
      - auth-service
      - user-service
      - notification-service
  
  kafka:
    image: apache/kafka:4.1.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: [ "CMD", "bash", "-c", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  kafka-init:
    image: apache/kafka:4.1.0
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./infra/kafka/create-topics.sh:/create-topics.sh:ro
    entrypoint: [ "/bin/bash", "/create-topics.sh" ]

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    environment:
      ConnectionStrings__DefaultConnection: Host=postgres;Database=auth_db;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Jwt__Issuer: https://auth.shopee.com
      Jwt__Audience: shopee-api
      Jwt__AccessTokenExpirationMinutes: 15
      Jwt__PrivateKeyPath: /app/keys/jwt-private.pem
      Jwt__KeyId: auth-key-2026-07
      Redis__ConnectionString: redis:6379
      Kafka__BootstrapServers: kafka:9092
    volumes:
      - ./services/auth-service/keys:/app/keys:ro
    ports:
      - '5001:8080'
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully

  user-service:
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    environment:
      ConnectionStrings__DefaultConnection: Host=postgres;Database=user_db;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Kafka__BootstrapServers: kafka:9092
    volumes:
      - ./services/user-service/keys:/app/keys:ro
    ports:
      - '5002:8080'
    depends_on:
      postgres:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully

  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/notification_db
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: notification-service
      KAFKA_GROUP_ID: notification-service-group
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
    ports:
      - '5006:3000'
    depends_on:
      postgres:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully

volumes:
  pgdata:
  kafkadata:
#  mongodata:
#  miniodata: