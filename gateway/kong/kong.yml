_format_version: "3.0"

services:
  - name: auth-service
    url: http://auth-service:8080
    routes:
      - name: auth-logout-protected
        paths: [ "/auth/logout" ]
        strip_path: false
        plugins:
          - name: jwt

      - name: auth-public
        paths: [ "/auth" ]
        strip_path: false

  - name: user-service
    url: http://user-service:8080
    routes:
      - name: user-protected
        paths: [ "/user" ]
        strip_path: false
        plugins:
          - name: jwt

  - name: seller-service
    url: http://seller-service:8080
    routes:
      - name: seller-protected
        paths: [ "/seller" ]
        strip_path: false
        plugins:
          - name: jwt

  - name: notification-service
    url: http://notification-service:3000
    routes:
      - name: notification-protected
        paths: [ "/notification" ]
        strip_path: false
        plugins:
          - name: jwt

  - name: media-service
    url: http://media-service:8080
    routes:
      - name: media-protected
        paths: [ "/media" ]
        strip_path: false
        plugins:
          - name: jwt

  - name: product-catalog-service
    url: http://product-catalog-service:8080
    routes:
      - name: product-catalog-public
        paths: [ "/product-catalog" ]
        methods: [ "GET" ]
        strip_path: false

      - name: product-catalog-protected
        paths: [ "/product-catalog" ]
        methods: [ "POST", "PUT", "PATCH", "DELETE" ]
        strip_path: false
        plugins:
          - name: jwt

  - name: inventory-service
    url: http://inventory-service:8080
    routes:
      - name: inventory-protected
        paths: [ "/inventory" ]
        strip_path: false
        plugins:
          - name: jwt

  - name: search-service
    url: http://search-service:8080
    routes:
      - name: search-public
        paths: [ "/search" ]
        strip_path: false

  - name: order-service
    url: http://order-service:8080
    routes:
      - name: order-protected
        paths: [ "/order" ]
        strip_path: false
        plugins:
          - name: jwt

  - name: payment-service
    url: http://payment-service:8080
    routes:
      - name: payment-protected
        paths: [ "/payment" ]
        strip_path: false
        plugins:
          - name: jwt

  - name: promotion-service
    url: http://promotion-service:8080
    routes:
      - name: promotion-protected
        paths: [ "/promotion" ]
        strip_path: false
        plugins:
          - name: jwt

  - name: shipping-service
    url: http://shipping-service:8080
    routes:
      - name: shipping-protected
        paths: [ "/shipping" ]
        strip_path: false
        plugins:
          - name: jwt

  - name: review-service
    url: http://review-service:8080
    routes:
      - name: review-protected
        paths: [ "/review" ]
        strip_path: false
        plugins:
          - name: jwt

  - name: cart-service
    url: http://cart-service:8080
    routes:
      - name: cart-protected
        paths: [ "/cart" ]
        strip_path: false
        plugins:
          - name: jwt

  - name: chat-service
    url: http://chat-service:8080
    routes:
      - name: chat-protected
        paths: [ "/chat" ]
        strip_path: false
        plugins:
          - name: jwt

consumers:
  - username: auth-service-issuer
    jwt_secrets:
      - algorithm: RS256
        key: "https://auth.shopee.com"
        rsa_public_key: |
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAksp+vx/IM8XpeKahaxAk
          1/3jST0OrKQSIt9ip9FRWfTlmKy63EyZPoENJXAwX+2PpId39HugpYioCs6sx/4P
          h4X0N7mGuNNY6IIJoLTRgGG36/tv/N/P2pYvkbMQTFjNyzQhB9qXxlpeecbVdtMz
          z17LVBfMk6qa23d4U3WHtKBx1CtiwxC7GiXmhT8q0ga371GkFSSTO/691W3eb8p0
          2gRr2Oal/EymjTaQIYZq4Hk8pp57H9hkvxeCJYqtRcf26ZhhTYoVkYjb1b82Gnbw
          uWZlvFTIdY5bgwib7Zxs47sRvGsXaJWFzs+lFTdk9isn/yhS1e1Gs2kHX8cI0Lx2
          CwIDAQAB
          -----END PUBLIC KEY-----
        secret: "unused"

plugins:
  - name: post-function
    config:
      access:
        - |
          local jwt_parser = require "kong.plugins.jwt.jwt_parser"

          local token = kong.ctx.shared.authenticated_jwt_token
          if token then
            local jwt_obj = jwt_parser:new(token)

            if jwt_obj and jwt_obj.claims then
              if jwt_obj.claims.sub then
                kong.service.request.set_header("X-User-Id", jwt_obj.claims.sub)
              end

              local roleClaim = jwt_obj.claims["role"]
              if roleClaim then
                if type(roleClaim) == "table" then
                  kong.service.request.set_header("X-User-Roles", table.concat(roleClaim, ","))
                else
                  kong.service.request.set_header("X-User-Roles", roleClaim)
                end
              end
            end
          end