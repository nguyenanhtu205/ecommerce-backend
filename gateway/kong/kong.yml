_format_version: "3.0"

services:
  - name: auth-service
    url: http://auth-service:8080
    routes:
      - name: auth-public
        paths: [ "/auth" ]
        strip_path: false

  - name: user-service
    url: http://user-service:8080
    routes:
      - name: user-protected
        paths: ["/user"]
        strip_path: false
        plugins:
          - name: jwt
            
  - name: seller-service
    url: http://seller-service:8080
    routes:
      - name: seller-protected
        paths: [ "/seller" ]
        strip_path: false
        plugins:
          - name: jwt
            
  - name: notification-service
    url: http://notification-service:8080
    routes:
      - name: notification-protected
        paths: [ "/notification" ]
        strip_path: false
        plugins:
          - name: jwt
            
  - name: media-service
    url: http://media-service:8080
    routes:
      - name: media-protected
        paths: [ "/media" ]
        strip_path: false
        plugins:
          - name: jwt
            
consumers:
  - username: auth-service-issuer
    jwt_secrets:
      - algorithm: RS256
        key: "https://auth.shopee.com"
